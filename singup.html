<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .signup-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="signup-container">
        <h3 class="text-center">Ro‘yxatdan o‘tish</h3>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Ism</label>
                <input type="text" class="form-control" id="name" placeholder="Ismingizni kiriting">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Email kiriting">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Parol</label>
                <input type="password" class="form-control" id="password" placeholder="Parol kiriting">
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">Parolni tasdiqlang</label>
                <input type="password" class="form-control" id="confirm-password" placeholder="Parolni qaytadan kiriting">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-success">Ro‘yxatdan o‘tish</button>
            </div>
            <div class="text-center mt-3">
                <a href="login.html">Allaqachon akkauntingiz bormi? Kirish</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
